name: Deploy AI FACTORY

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js favicon.svg robots.txt dist/

      - name: Check Cloudflare deployment secret
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped. Add the CLOUDFLARE_API_TOKEN repository secret to enable publishing."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: cda7446423c24ef649c2f42e4ec8fd39
          command: pages deploy dist --project-name=ai-factory-tools --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
